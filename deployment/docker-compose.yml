services:
  backend:
    build:
      context: ../backend
    container_name: backend
    ports:
      - "5000:5000"
    env_file:
      - ../backend/.env
    networks:
      - app-network

  frontend:
    build:
      context: ../frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network
  nginx:
    build: ../nginx
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
